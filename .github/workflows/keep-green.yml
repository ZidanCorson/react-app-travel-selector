name: Keep Commit Diagram Green

on:
  schedule:
    - cron: '0 7 * * *' # Every day at 07:00 UTC
  workflow_dispatch:

jobs:
  keep-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Make empty commit
        run: |
          git commit --allow-empty -m "chore: keep commit diagram green [skip ci]" || echo "No changes to commit"
      - name: Push commit
        run: |
          git push https://$GH_PAT@github.com/ZidanCorson/react-app-travel-selector.git HEAD:main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
